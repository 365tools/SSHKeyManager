[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sshm"
dynamic = ["version"]
description = "企业级多账号 SSH 密钥管理工具"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Eavelabs", email = "eavelabs@users.noreply.github.com" }]
requires-python = ">=3.10"
keywords = ["ssh", "git", "key-manager", "cli"]
dependencies = [
    "typer>=0.12",
    "click>=8.1",
    "rich>=13.7",
    "packaging>=23.0",
    "wcwidth>=0.2.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.6",
    "basedpyright>=1.0",
    "pyinstaller>=6.0",
]

[project.scripts]
sshm = "sshm.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

# 版本号从独立版本文件读取：构建期只读文件、不 import 整个包，
# 避免 `pip install .` 时因运行时依赖(rich 等)未装而构建失败
# （`attr = "sshm.__version__"` 会 import 包并触发第三方依赖，CI 上必崩）。
[tool.setuptools.dynamic]
version = { file = "src/sshm/_version.txt" }

[tool.setuptools.package-data]
sshm = ["_version.txt"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
python_files = "test_*.py"
python_functions = "test_*"

[tool.basedpyright]
include = ["src"]
exclude = ["**/__pycache__", "**/*.pyc", "**/.git", "scripts", "docs", "repo"]
typeCheckingMode = "basic"
pythonVersion = "3.14"
analyzeUnannotatedFunctions = false
