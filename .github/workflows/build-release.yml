name: Build and Release

on:
  push:
    tags:
      - 'v*'  # 当推送 v* 标签时触发（如 v1.0.0）
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: sshm.exe
            asset_name: sshm-windows-amd64.exe
          - os: ubuntu-latest
            artifact_name: sshm
            asset_name: sshm-linux-amd64
          - os: macos-latest
            artifact_name: sshm
            asset_name: sshm-macos-amd64

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 安装项目自身依赖（typer/click/wcwidth，来自 pyproject.toml），
          # 否则 PyInstaller 打出的包里缺 typer，可执行文件运行时直接崩溃
          # （ModuleNotFoundError: No module named 'typer'）
          pip install . pyinstaller

      - name: Build with PyInstaller (Windows)
        if: matrix.os == 'windows-latest'
        # 使用 sshm.spec（含 _version.txt + CHANGELOG.md 的 datas 与瘦身 excludes），
        # 确保 exe 版本能正确解析（否则 exe 运行时会回落 0.0.0 误报“有新版本”）
        run: pyinstaller sshm.spec

      - name: Build with PyInstaller (Unix)
        if: matrix.os != 'windows-latest'
        run: pyinstaller sshm.spec

      - name: Test executable (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          .\dist\sshm.exe --help

      - name: Test executable (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          chmod +x ./dist/sshm
          ./dist/sshm --help

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.artifact_name }}

  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          python -m pytest -q

  release:
    name: Create Release
    needs: [build, test]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write  # 允许创建 release
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          # 遍历所有构建产物，按产物名生成 release 资产（无需逐个硬编码，增删平台自动适配）
          for dir in artifacts/*/; do
            name="$(basename "$dir")"
            cp "${dir}"* "release/$name"
          done
          ls -lh release/

      # 使用 Eavelabs/actions 集合中的 release-notes action 创建 Release：
      #   - 版本号从推送的 tag 自动推导（refs/tags/v1.0.0 -> 1.0.0）
      #   - Release 正文主体 = CHANGELOG 中对应版本的内容（单一事实来源）
      #   - extra_body 只保留安装说明、PATH 提示与文档链接
      #   - 引用 @main 分支（action 尚未打 tag，跟随 main 最新改动）
      - name: Create Release
        id: create_release
        uses: eavelabs-community/actions/release-notes@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          derive_version_from_ref: "true"        # 从 ${{ github.ref }} 自动取版本号
          changelog_globs: "docs/CHANGELOG.md,CHANGELOG.md"  # 优先 docs/，回退根目录
          generate_release_notes: "true"         # 追加从上一个 tag 的提交变更记录
          release_name: "sshm"                   # Release 标题前缀
          draft: "false"
          prerelease: "false"
          extra_body: |
            ### 🚀 快速安装

            **Windows 用户**

            ```powershell
            # 一键安装脚本
            irm https://raw.githubusercontent.com/eavelabs-community/sshm/main/scripts/install.ps1 | iex
            ```

            **Linux / macOS 用户**

            ```bash
            # 一键安装脚本
            curl -fsSL https://raw.githubusercontent.com/eavelabs-community/sshm/main/scripts/install.sh | bash
            ```

            > 💡 **`sshm` 显示旧版本 / 运行报错？** 可能是 PATH 残留了旧目录，重装并加清理参数：
            > - **Windows**: `powershell -File install.ps1 -CleanPath`
            > - **Linux/macOS**: `bash install.sh --clean-path`
            > 清理后请重新打开终端。

            ### 📦 手动下载

            如果您无法访问在线安装脚本，可以直接下载下方 Asset 中的文件：

            - **Windows**: 下载 `sshm-windows-amd64.exe` (双击即可使用)
            - **Linux**: 下载 `sshm-linux-amd64`
            - **macOS**: 下载 `sshm-macos-amd64`

            ### 📝 使用文档

            查看完整文档：[README.md](https://github.com/${{ github.repository }}/blob/main/README.md)

            ---
          files: |
            release/sshm-windows-amd64.exe
            release/sshm-linux-amd64
            release/sshm-macos-amd64
